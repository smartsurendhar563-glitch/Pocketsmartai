{% extends 'base.html' %}{% block content %}<section class="planner"><div class="planner-intro"><div class="eyebrow">PARTY BUDGET PLANNER</div><h1>Plan your perfect event with AI-powered budget recommendations.</h1><p>Build a realistic event budget across venue, catering, decoration and entertainment.</p></div><form id="partyForm" class="form-card"><label>Total Budget (INR)<input type="number" name="total_budget" min="1" value="50000" required></label><div class="two"><label>Party Type<select name="party_type"><option>Birthday</option><option>Wedding</option><option>Engagement</option><option>Anniversary</option><option>Corporate</option></select></label><label>Venue Type<select name="venue_type"><option>Indoor</option><option>Outdoor</option><option>Banquet Hall</option><option>Restaurant</option></select></label></div><label>Number of Guests<input type="number" name="num_guests" min="1" value="30" required></label><label>Needs<input name="needs" placeholder="Catering, Entertainment, Decorations"></label><label>Special Requirements<textarea name="requirements"></textarea></label><button class="btn full">Generate Recommendations</button><div id="result" class="result"></div></form></section>{% endblock %}{% block scripts %}<script>plannerForm('partyForm','/api/party-budget','party');</script>{% endblock %}
