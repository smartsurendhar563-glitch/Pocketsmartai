{% extends 'base.html' %}{% block content %}<section class="planner"><div class="planner-intro"><div class="eyebrow">JEWELRY BUDGET PLANNER</div><h1>Find jewelry that complements your occasion, outfit and budget.</h1><p>Optionally upload an outfit image for AI-assisted color and style analysis.</p></div><form id="jewelryForm" class="form-card" enctype="multipart/form-data"><label>Total Budget (INR)<input type="number" name="total_budget" min="1" value="20000" required></label><label>Occasion<select name="occasion"><option>Birthday</option><option>Wedding</option><option>Engagement</option><option>Anniversary</option><option>Festive</option></select></label><label>Preferences<textarea name="preferences" placeholder="Gold tone, minimal, traditional, statement, etc."></textarea></label><label>Outfit Image<input type="file" name="image" accept="image/*"></label><button class="btn full">Generate Recommendations</button><div id="result" class="result"></div></form></section>{% endblock %}{% block scripts %}<script>plannerForm('jewelryForm','/api/jewelry-budget','jewelry');</script>{% endblock %}
