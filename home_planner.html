{% extends 'base.html' %}{% block content %}<section class="planner"><div class="planner-intro"><div class="eyebrow">HOME INTERIOR BUDGET PLANNER</div><h1>Create a customized budget plan for your dream home interior.</h1><p>Tell PocketSmart what you need. The AI will organize the budget and suggest practical products.</p></div><form id="homeForm" class="form-card"><label>Total Budget (INR)<input type="number" name="total_budget" min="1" value="50000" required></label><div class="two"><label>Rooms<input name="rooms" value="Living Room, Kitchen"></label><label>Lights<input type="number" name="num_lights" value="5" min="0"></label></div><div class="two"><label>Ceiling Fans<input type="number" name="num_fans" value="4" min="0"></label><label>Furniture Pieces<input type="number" name="num_furniture" value="2" min="0"></label></div><label>Dining Tables<input type="number" name="num_dining_tables" value="1" min="0"></label><label>Special Requirements<textarea name="requirements" placeholder="Any specific requirements or preferences."></textarea></label><button class="btn full">Generate Recommendations</button><div id="result" class="result"></div></form></section>{% endblock %}{% block scripts %}<script>plannerForm('homeForm','/api/home-budget','home');</script>{% endblock %}
